<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>知识库图谱</title>
<style>
  :root{ --bg:#0d1117; --panel:#161b22cc; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --accent:#58a6ff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #graph{position:fixed;inset:0}
  /* 标签用 HTML 叠层，不用 THREE 的 Sprite：
     3d-force-graph 的 UMD 包只导出 ForceGraph3D、不挂全局 THREE，
     而 three 从 0.166 起不再发 UMD 版，没法用 script 标签补上。
     graph2ScreenCoords() 把节点坐标换成屏幕坐标，文字还比 canvas 贴图清晰。 */
  #lblLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;transform:translate(-50%,-150%);white-space:nowrap;
    font-size:11.5px;font-weight:600;color:var(--fg);
    text-shadow:0 1px 3px #000,0 0 9px #000,0 0 2px #000}
  .lbl.dim{color:#6e7681;text-shadow:0 1px 2px #000}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;backdrop-filter:blur(12px);padding:12px 14px}
  #ui{top:12px;left:12px;width:264px;max-height:calc(100vh - 24px);overflow:auto}
  #info{bottom:12px;right:12px;width:320px;display:none}
  h1{margin:0 0 2px;font-size:15px;font-weight:650;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:12px;margin-bottom:10px}
  .sub b{color:var(--fg);font-weight:600}
  input[type=search]{width:100%;padding:6px 9px;margin-bottom:10px;background:#0d1117;
    border:1px solid var(--line);border-radius:7px;color:var(--fg);font-size:13px}
  input[type=search]:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;align-items:center;gap:7px;padding:2.5px 0;font-size:12.5px;cursor:pointer;user-select:none}
  .row:hover{color:var(--accent)}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .off{opacity:.32}
  .cnt{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
  hr{border:0;border-top:1px solid var(--line);margin:10px 0}
  label.ck{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;padding:2.5px 0}
  #info .path{color:var(--dim);font-size:11.5px;word-break:break-all;font-family:ui-monospace,Consolas,monospace}
  #info h2{margin:0 0 6px;font-size:14px}
  #info ul{margin:8px 0 0;padding-left:18px;font-size:12.5px}
  #info a{color:var(--accent);text-decoration:none}
  #info a:hover{text-decoration:underline}
  #drop{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;text-align:center;padding:24px}
  #drop .box{border:2px dashed var(--line);border-radius:14px;padding:40px 48px;max-width:560px}
  #drop.hot .box{border-color:var(--accent)}
  #drop h1{font-size:19px;margin-bottom:10px}
  #drop p{color:var(--dim);font-size:13px;margin:8px 0}
  #drop code{background:#161b22;padding:2px 6px;border-radius:4px;font-size:12px}
  .btn{display:inline-block;margin-top:14px;padding:8px 18px;background:var(--accent);color:#04121f;
    border:0;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer}
  .note{margin-top:16px;font-size:12px;color:var(--dim);line-height:1.7}
  #err{color:#f85149;font-size:12.5px;margin-top:10px;min-height:1em}
  @media (max-width:640px){#ui{width:calc(100vw - 24px)}#info{width:calc(100vw - 24px);left:12px}}
</style>
</head>
<body>

<div id="graph"></div>
<div id="lblLayer"></div>

<div id="drop">
  <div class="box">
    <h1>知识库图谱</h1>
    <p>选择 <code>graph.json</code>（由 <code>build-graph.mjs</code> 生成）</p>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <button class="btn" id="pick">选择文件</button>
    <button class="btn" id="demo" style="background:#21262d;color:#e6edf3;margin-left:8px">载入示例</button>
    <p style="margin-top:12px">或直接把文件拖到这个页面上</p>
    <div id="err"></div>
    <div class="note">
      文件只在你的浏览器里解析，<b>不会上传到任何地方</b> —— 这个页面没有后端。<br>
      渲染用 <a href="https://github.com/vasturiano/3d-force-graph" style="color:var(--accent)">3d-force-graph</a>（MIT）。
    </div>
  </div>
</div>

<div class="panel" id="ui" style="display:none">
  <h1>知识库图谱</h1>
  <div class="sub"><b id="nN">0</b> 个条目 · <b id="eN">0</b> 条链接</div>
  <input type="search" id="q" placeholder="搜标题或路径…" autocomplete="off">
  <div id="legend"></div>
  <hr>
  <label class="ck"><input type="checkbox" id="dirEdges"> 显示目录归属边</label>
  <label class="ck"><input type="checkbox" id="labels" checked> 常显标题</label>
  <label class="ck"><input type="checkbox" id="flat"> 压成 2D</label>
  <hr>
  <div class="sub" style="margin:0">拖拽旋转 · 滚轮缩放 · 点节点看详情</div>
</div>

<div class="panel" id="info"></div>

<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1/dist/3d-force-graph.min.js"></script>
<script>
const INLINE = /*__DATA__*/null;

const PALETTE = ['#58a6ff','#3fb950','#d29922','#f778ba','#a371f7','#39c5cf','#ff7b72','#bc8cff','#7ee787'];
const $ = s => document.querySelector(s);
let G = null, DATA = null, colorOf = {}, hidden = new Set(), showDir = false;
let labelEls = new Map(), rafOn = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function nodeDim(n){
  const q = $('#q').value.trim().toLowerCase();
  if(hidden.has(n.group)) return true;
  if(q && !(n.title.toLowerCase().includes(q) || n.id.toLowerCase().includes(q))) return true;
  return false;
}

function boot(data){
  if(!data || !Array.isArray(data.nodes) || data.nodes.length === 0) throw new Error('graph.json 里没有 nodes');
  DATA = data;
  $('#drop').style.display = 'none';
  $('#ui').style.display = 'block';

  (data.groups || [...new Set(data.nodes.map(n => n.group))]).forEach((g, i) => {
    colorOf[g] = PALETTE[i % PALETTE.length];
  });

  G = ForceGraph3D()($('#graph'))
    .backgroundColor('#0d1117')
    .nodeLabel(n => '<div style="background:#161b22;border:1px solid #30363d;border-radius:6px;padding:4px 8px;color:#e6edf3;font:12px sans-serif">' + esc(n.id) + '</div>')
    .nodeColor(n => nodeDim(n) ? '#21262d' : colorOf[n.group])
    .nodeVal(n => 1.2 + Math.min(n.deg || 0, 8) * 0.9 + (n.isIndex ? 2.5 : 0))
    .nodeOpacity(0.95)
    .linkColor(l => l.kind === 'dir' ? '#21262d' : (l.kind === 'wiki' ? '#3fb95088' : '#58a6ff88'))
    .linkWidth(l => l.kind === 'dir' ? 0.3 : 0.8)
    .onNodeClick(n => { focus(n); showInfo(n); })
    .onBackgroundClick(() => { $('#info').style.display = 'none'; });

  G.d3Force('charge').strength(-140);
  applyData();
  renderLegend();
  $('#nN').textContent = data.nodes.length;
  $('#eN').textContent = data.links.filter(l => l.kind !== 'dir').length;
  if(!rafOn){ rafOn = true; requestAnimationFrame(syncLabels); }
}

/** 重新设一遍 nodeColor 存取器，触发库内部重绘 */
function refresh(){
  G.nodeColor(n => nodeDim(n) ? '#21262d' : colorOf[n.group]);
}

function applyData(){
  const nodes = DATA.nodes.filter(n => !hidden.has(n.group));
  const ids = new Set(nodes.map(n => n.id));
  const links = DATA.links.filter(l =>
    (showDir || l.kind !== 'dir') &&
    ids.has(l.source.id ?? l.source) && ids.has(l.target.id ?? l.target));
  G.graphData({ nodes: nodes, links: links });
  rebuildLabels();
}

function rebuildLabels(){
  const box = $('#lblLayer');
  box.textContent = '';
  labelEls = new Map();
  if(!$('#labels').checked) return;
  for(const n of G.graphData().nodes){
    const el = document.createElement('div');
    el.className = 'lbl';
    el.textContent = n.title;
    box.appendChild(el);
    labelEls.set(n, el);
  }
}

/** 每帧把 3D 坐标投影成屏幕坐标；相机一动就跟着动，所以用 rAF 而不是 onEngineTick */
function syncLabels(){
  if(G && labelEls.size){
    const W = innerWidth, H = innerHeight;
    labelEls.forEach((el, n) => {
      if(n.x === undefined || n.x === null){ el.style.visibility = 'hidden'; return; }
      const p = G.graph2ScreenCoords(n.x, n.y, n.z || 0);
      // p.z 越界表示节点在相机背后，投影会翻到屏幕上造成鬼影
      if(!p || (p.z !== undefined && (p.z > 1 || p.z < -1)) ||
         p.x < -100 || p.y < -50 || p.x > W + 100 || p.y > H + 50){
        el.style.visibility = 'hidden'; return;
      }
      el.style.visibility = 'visible';
      el.style.left = p.x + 'px';
      el.style.top = p.y + 'px';
      const dim = nodeDim(n);
      el.classList.toggle('dim', dim);
      el.style.opacity = dim ? '0.3' : '1';
    });
  }
  requestAnimationFrame(syncLabels);
}

function focus(n){
  const d = 90, r = Math.hypot(n.x, n.y, n.z || 0) || 1;
  G.cameraPosition({ x: n.x * (1 + d / r), y: n.y * (1 + d / r), z: (n.z || 0) * (1 + d / r) }, n, 700);
}

function showInfo(n){
  const nb = DATA.links.filter(l => l.kind !== 'dir').map(l => {
    const s = l.source.id ?? l.source, t = l.target.id ?? l.target;
    return s === n.id ? t : (t === n.id ? s : null);
  }).filter(Boolean);
  const uniq = [...new Set(nb)];
  let html = '<h2 style="color:' + colorOf[n.group] + '">' + esc(n.title) + '</h2>' +
    '<div class="path">' + esc(n.id) + '</div>' +
    '<div class="sub" style="margin:8px 0 0">' + esc(n.group) + ' · ' + (n.lines || '?') + ' 行 · ' + (n.deg || 0) + ' 条链接</div>';
  if(uniq.length){
    html += '<ul>' + uniq.slice(0, 12).map(id => {
      const m = DATA.nodes.find(x => x.id === id);
      return '<li><a href="#" data-go="' + esc(id) + '">' + esc(m ? m.title : id) + '</a></li>';
    }).join('');
    if(uniq.length > 12) html += '<li style="color:var(--dim)">… 另 ' + (uniq.length - 12) + ' 条</li>';
    html += '</ul>';
  } else {
    html += '<div class="sub" style="margin-top:8px">没有链接到别的条目</div>';
  }
  const box = $('#info');
  box.style.display = 'block';
  box.innerHTML = html;
  box.querySelectorAll('[data-go]').forEach(a => a.onclick = e => {
    e.preventDefault();
    const live = G.graphData().nodes.find(x => x.id === a.dataset.go);
    if(live){ focus(live); showInfo(live); }
  });
}

function renderLegend(){
  const counts = {};
  DATA.nodes.forEach(n => counts[n.group] = (counts[n.group] || 0) + 1);
  $('#legend').innerHTML = Object.keys(colorOf).map(g =>
    '<div class="row" data-g="' + esc(g) + '"><span class="dot" style="background:' + colorOf[g] +
    '"></span>' + esc(g) + '<span class="cnt">' + (counts[g] || 0) + '</span></div>').join('');
  $('#legend').querySelectorAll('[data-g]').forEach(el => el.onclick = () => {
    const g = el.dataset.g;
    if(hidden.has(g)){ hidden.delete(g); el.classList.remove('off'); }
    else { hidden.add(g); el.classList.add('off'); }
    applyData();
  });
}

$('#q').oninput = () => refresh();
$('#dirEdges').onchange = e => { showDir = e.target.checked; applyData(); };
$('#labels').onchange = () => rebuildLabels();
$('#flat').onchange = e => { G.numDimensions(e.target.checked ? 2 : 3); };

function fail(m){ $('#err').textContent = m; }
function load(text, from){
  try { boot(JSON.parse(text)); }
  catch(e){ fail(from + ' 解析失败：' + e.message); }
}

$('#pick').onclick = () => $('#file').click();
$('#demo').onclick = () => {
  fetch('./sample.json')
    .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(t => load(t, 'sample.json'))
    .catch(e => fail('示例载入失败（用 file:// 本地打开时浏览器会拦跨源请求）：' + e.message));
};
$('#file').onchange = e => {
  const f = e.target.files[0];
  if(f) f.text().then(t => load(t, f.name));
};
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); $('#drop').classList.add('hot');
}));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); $('#drop').classList.remove('hot');
}));
document.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if(f) f.text().then(t => load(t, f.name));
});

(function init(){
  if(INLINE){ boot(INLINE); return; }
  const u = new URLSearchParams(location.search).get('data');
  if(u){
    fetch(u).then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(t => load(t, u))
      .catch(e => fail('拉取 ' + u + ' 失败：' + e.message));
  }
})();
</script>
</body>
</html>
